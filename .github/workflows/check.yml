name: Check course
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: latest
      - run: quarto render --profile student
      - run: quarto render --profile full
