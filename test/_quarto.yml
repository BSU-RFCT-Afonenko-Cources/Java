project:
  type: default
  output-dir: _output

crossref:
  exr-title: ''
  exr-prefix: вопр.
  chapters: false

lang: ru

format:
  pdf:
    pdf-engine: lualatex
    code-block-bg: "#FCFCFC"
    latex-auto-install: false
    use-rsvg-convert: true
    papersize: a4
    colorlinks: true
    mainfont: CMU Serif
    sansfont: CMU Sans Serif
    monofont: CMU Typewriter Text
    fontsize: 10pt
    number-sections: false
