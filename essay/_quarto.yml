project:
  type: book
  output-dir: _book/student
  resources:
    - "!**/projects/**"
    - "!**/_control.qmd"
    - "!_generated/**"
    - "!tools/**"
    - "!docs/**"
profile:
  default: student
  group:
    - [student, full]
course:
  id: java-essays
  validate: true
  view: student
course-pedagogy:
  document-defaults: true
# Указатели Quarto и учебные блоки читают общие метаданные темы.
# Атрибуты упражнения уточняют значения, заданные для всей главы.
work-mode: individual
prairielearn:
  assessment-defaults:
    attempts: 3
    pass:
      at-least: 2
    assignment:
      mode: assessment-id
filters:
  - course-core
  - course-prairielearn
  - course-presentation
book:
  title: "Исследовательские рефераты по Core Java"
  chapters:
    - index.qmd
    - part: numbers/index.qmd
      chapters:
        - numbers/integer-promotions/index.qmd
        - numbers/cyclic-indices/index.qmd
        - numbers/floating-equality/index.qmd
        - numbers/boxing-null/index.qmd
        - numbers/evaluation-order/index.qmd
    - part: text-arrays/index.qmd
      chapters:
        - text-arrays/unicode-codepoints/index.qmd
        - text-arrays/normalization-locale/index.qmd
        - text-arrays/string-identity/index.qmd
        - text-arrays/array-covariance/index.qmd
        - text-arrays/matrix-copying/index.qmd
        - text-arrays/unicode-demonstration/index.qmd
    - part: object-model/index.qmd
      chapters:
        - object-model/overload-dispatch/index.qmd
        - object-model/construction/index.qmd
        - object-model/equality-inheritance/index.qmd
        - object-model/record-components/index.qmd
        - object-model/sealed-switch/index.qmd
    - part: generics-collections/index.qmd
      chapters:
        - generics-collections/generic-variance/index.qmd
        - generics-collections/type-erasure/index.qmd
        - generics-collections/mutable-keys/index.qmd
        - generics-collections/sorted-equality/index.qmd
        - generics-collections/views-snapshots/index.qmd
    - part: functional-processing/index.qmd
      chapters:
        - functional-processing/lambda-capture/index.qmd
        - functional-processing/stream-laziness/index.qmd
        - functional-processing/reduction-laws/index.qmd
        - functional-processing/optional-evaluation/index.qmd
        - functional-processing/map-collisions/index.qmd
    - part: failures-boundaries/index.qmd
      chapters:
        - failures-boundaries/finally-control/index.qmd
        - failures-boundaries/suppressed-exceptions/index.qmd
        - failures-boundaries/failure-atomicity/index.qmd
        - failures-boundaries/constant-inlining/index.qmd
        - failures-boundaries/charset-decoding/index.qmd
    - part: shared-state/index.qmd
      chapters:
        - shared-state/safe-publication/index.qmd
        - shared-state/atomic-invariants/index.qmd
        - shared-state/monitor-protocols/index.qmd
        - shared-state/cooperative-interruption/index.qmd
        - shared-state/lock-order/index.qmd
    - part: task-lifecycle/index.qmd
      chapters:
